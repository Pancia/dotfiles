[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:.*deprecated in Kerykeion.*:DeprecationWarning
    ignore:.*'AstrologicalSubject' is deprecated.*:DeprecationWarning
    ignore:.*'NatalAspects' is deprecated.*:DeprecationWarning
    ignore:.*'SynastryAspects' is deprecated.*:DeprecationWarning
    ignore:.*'true_node'.*:DeprecationWarning
    ignore:.*'true_south_node'.*:DeprecationWarning
    ignore:.*'mean_lilith'.*:DeprecationWarning
