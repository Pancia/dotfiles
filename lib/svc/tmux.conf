# tmux config for the dedicated `svc-tmux` server (tmux -L svc). Loaded when
# that server starts (or by hand: tmux -L svc source-file <this file>).

# Your own bindings first - prefix (C-Space), mouse, copy, plugins - so attaching
# feels like your normal tmux. Its plugins (tpm, which-key) are safe to run here;
# re-check that before adding one that saves/restores sessions (resurrect,
# continuum), which would act on the svc server too. The settings below win.
# which-key rebuilds its menu at load with a vendored pyyaml that is missing in
# this checkout (plugin/pyyaml is empty), so the build fails and the plugin never
# loads. Use the init.tmux already built instead.
set -g @tmux-which-key-disable-autobuild 1
source-file -q ~/.config/tmux/tmux.conf

# A crashed service stays on screen, stack trace and all; `svc-tmux up` respawns
# it. A clean exit (Ctrl-C, svc stop, svc-tmux down) closes its window. (`q` in a
# window doesn't exit at all: under tmux it stops the service and keeps the window.)
set -g remain-on-exit failed
set -g remain-on-exit-format "#[reverse] #{window_name} crashed (exit #{pane_dead_status}) #[default] scroll up for the error · svc-tmux up #{window_name} to restart"
# Window names ARE the service names - svc-tmux targets them with `=name`.
set -g automatic-rename off
set -g allow-rename off
set -g history-limit 50000
set -g mouse on
set -g escape-time 10            # Esc closes supervise's help panel; don't sit on it
set -g base-index 1
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 160
set -g status-left "#[bold] #{s/^svc-//:session_name} #[default]"
set -g window-status-current-style "bold,reverse"

# The window chooser: services are windows, so open with windows showing
# (tmux's default `s` starts with sessions collapsed).
bind s choose-tree -Zw
bind w choose-tree -Zw
